<style>
:root{
  --bg:#eef4fb; --ink:#0d2340; --muted:#4a6280; --accent:#1d5fd1; --accent-ink:#ffffff; --line:#cddbed; --wa:#128c4a; --wa-ink:#ffffff;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--wa:#25d366; --wa-ink:#052e14; --bg:#0b1626; --ink:#e8f0fc; --muted:#93a8c6; --accent:#4d9bff; --accent-ink:#04152e; --line:#1f3350;}
}
:root[data-theme="dark"]{--wa:#25d366; --wa-ink:#052e14; --bg:#0b1626; --ink:#e8f0fc; --muted:#93a8c6; --accent:#4d9bff; --accent-ink:#04152e; --line:#1f3350;}
*{box-sizing:border-box}
html{height:100%;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;min-height:100%;min-height:100dvh;background:var(--bg);color:var(--ink);
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  display:grid;place-items:center;padding:clamp(16px,5vw,48px);overflow-wrap:anywhere}
main{max-width:min(640px,100%);width:100%}
.gear{width:clamp(56px,14vw,96px);height:clamp(56px,14vw,96px);color:var(--accent);margin-bottom:clamp(16px,4vw,32px)}
.gear svg{width:100%;height:100%;animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
h1{font-size:clamp(1.75rem,7vw + .25rem,3.5rem);line-height:1.1;margin:0 0 16px;font-weight:700;letter-spacing:-.02em}
p{font-size:clamp(1rem,2.4vw + .5rem,1.25rem);line-height:1.6;color:var(--muted);margin:0 0 clamp(20px,4vw,36px);max-width:46ch}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;gap:12px;-webkit-tap-highlight-color:transparent;background:var(--wa);color:var(--wa-ink);
  text-decoration:none;font-weight:600;font-size:1.05rem;padding:16px 26px;border-radius:999px;
  transition:transform .15s ease}
.btn:hover{transform:translateY(-2px)}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.btn svg{width:24px;height:24px;fill:currentColor}
.num{margin-top:18px;font-size:.95rem;color:var(--muted);border-top:1px solid var(--line);padding-top:18px}
@media (max-width:480px){
  body{place-items:start center;padding-top:clamp(32px,12vh,96px)}
  .btn{display:flex;width:100%;padding:16px 20px}
}
@media (max-height:480px) and (orientation:landscape){
  body{place-items:center}
  .gear{width:44px;height:44px;margin-bottom:10px}
  h1{font-size:1.6rem;margin-bottom:8px}
  p{margin-bottom:16px}
  .num{margin-top:12px;padding-top:12px}
}
@media (min-width:1400px){
  main{max-width:760px}
}
@media (prefers-reduced-motion: reduce){.gear svg{animation:none}.btn{transition:none}}
</style>
</head>
